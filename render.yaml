# Pre-production preview of Kinfolk, for ATS to look at while it is being built.
#
# Render reads this file when you create a Blueprint from the repository, and makes both the
# web service and the database. Everything here is the free plan: the database expires after
# 30 days and the service sleeps after 15 minutes idle (about 50 seconds to wake), which is
# the trade for costing nothing. Move both to "starter" to stop the sleeping.
#
# Set these by hand in the Render dashboard after the first deploy (see docs/DEPLOY.md):
#   SIGNUP_ALLOWLIST   who may create an account, e.g. "@atswealth.com"
#   SEED_EMAIL         the demo login handed to ATS
#   SEED_PASSWORD      its password — set it in the dashboard, never in this file
#   S3_*               Cloudflare R2, so uploads survive a redeploy
services:
  - type: web
    name: kinfolk-preview
    runtime: node
    plan: free
    region: oregon
    branch: main
    # The free plan has no shell and no pre-deploy hook, so migrations run here. `migrate
    # deploy` only applies what is outstanding, so repeating it on every build costs nothing.
    # pnpm comes from npm rather than corepack. Corepack wants to confirm the download before
    # it fetches pnpm, and a build box has nobody to answer, so it exits with ELIFECYCLE; the
    # prompt can be silenced with a variable, but installing pnpm directly removes the whole
    # class of problem and is no slower.
    buildCommand: >-
      npm install -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter api exec prisma generate &&
      pnpm --filter api exec prisma migrate deploy &&
      pnpm --filter web build
    startCommand: pnpm --filter api start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # This is a preview: no Google sign-in, no outbound email, and uploads on local disk
      # unless S3_* is set. The API prints what it is standing in for at boot.
      - key: ALLOW_DEV_ADAPTERS
        value: 'true'
      - key: NODE_VERSION
        value: '22'
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kinfolk-preview-db
          property: connectionString
      # Both must be the URL people actually visit: the CSRF check compares the Origin header
      # against them, and cookies are issued for it. Fill in after Render assigns the hostname.
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      - key: SIGNUP_ALLOWLIST
        sync: false
      # Public records ask for this before they can be opened or replaced (ADR 037). Without it
      # records are open to every member of the tree, so a deployment should always set it.
      - key: RECORDS_PASSPHRASE
        sync: false

databases:
  - name: kinfolk-preview-db
    plan: free
    region: oregon
