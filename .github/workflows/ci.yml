# The gate Render waits for before deploying main (render.yaml: autoDeployTrigger checksPass).
# Two jobs on two machines: vitest and Playwright must never share one, or the browser stalls
# while the test workers hog the CPU (CLAUDE.md gotchas).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit and API tests, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm from npm, not corepack: corepack asks before downloading and nobody is here to answer.
      - run: npm install -g pnpm@9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The API suite starts its own embedded Postgres; nothing to provision.
      - run: pnpm test
      - run: pnpm --filter web build
      - run: pnpm --filter web budget

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
