# Pre-production preview of Kinfolk, for ATS to look at while it is being built.
#
# Render reads this file when you create a Blueprint from the repository, and makes both the
# web service and the database. The live service (kinfolk-rc34.onrender.com) was made by hand
# to these settings, not from this file, so editing it changes nothing on Render: it records
# what runs, and rebuilds it if the service ever has to be recreated. Both are on the lowest
# paid plans, so the service never sleeps and the database never expires.
#
# Set these by hand in the Render dashboard after the first deploy (see docs/DEPLOY.md):
#   SIGNUP_ALLOWLIST   who may create an account, e.g. "@atswealth.com"
#   SEED_EMAIL         the demo login handed to ATS
#   SEED_PASSWORD      its password — set it in the dashboard, never in this file
services:
  - type: web
    name: kinfolk
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # Migrations run in the build (the free plan this began on had no pre-deploy hook). `migrate
    # deploy` only applies what is outstanding, so repeating it on every build costs nothing.
    # Two things this command has to get right, both learned the hard way:
    #  - pnpm comes from npm, not corepack: corepack asks before downloading pnpm and a build
    #    box has nobody to answer, so it exits with a bare ELIFECYCLE.
    #  - `--prod=false` is required because NODE_ENV=production is set here, and pnpm reads that
    #    as "skip devDependencies". prisma, vite and typescript are dev dependencies and the
    #    build needs all three; without the flag, apps/api's `postinstall: prisma generate`
    #    fails with "Command prisma not found" and pnpm hides the reason.
    buildCommand: >-
      npm install -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter api exec prisma generate &&
      pnpm --filter api exec prisma migrate deploy &&
      pnpm --filter web build
    startCommand: pnpm --filter api start
    healthCheckPath: /api/health
    # A push to main deploys only once GitHub's CI workflow (.github/workflows/ci.yml) is green.
    autoDeployTrigger: checksPass
    # Photos and record PDFs live here and survive deploys (ADR 044). A disk means one instance
    # and a short outage on each deploy.
    disk:
      name: kinfolk-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LOCAL_STORAGE_DIR
        value: /var/data/storage
      - key: LOCAL_STORAGE_PERSISTENT
        value: 'true'
      - key: NODE_ENV
        value: production
      # This is a preview: no Google sign-in and no outbound email. The API prints what it is
      # standing in for at boot.
      - key: ALLOW_DEV_ADAPTERS
        value: 'true'
      - key: NODE_VERSION
        value: '22'
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kinfolk-preview-db
          property: connectionString
      # Both must be the URL people actually visit: the CSRF check compares the Origin header
      # against them, and cookies are issued for it. Fill in after Render assigns the hostname.
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      - key: SIGNUP_ALLOWLIST
        sync: false
      # Public records ask for this before they can be opened or replaced (ADR 037). Without it
      # records are open to every member of the tree, so a deployment should always set it.
      - key: RECORDS_PASSPHRASE
        sync: false

databases:
  - name: kinfolk-preview-db
    plan: basic-256mb
    region: oregon
